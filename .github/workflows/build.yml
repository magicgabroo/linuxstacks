name: Build LinuxStacks

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build LinuxStacks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache tauri build
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-tauri-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tauri-target-

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            qemu-system-x86 qemu-kvm

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LinuxStacks ${{ github.ref_name }}"
          releaseBody: |
            LinuxStacks ${{ github.ref_name }}
            Android emulator for Linux using KVM/QEMU.

            **Installation on Ubuntu 26.04:**
            ```bash
            sudo apt install ./LinuxStacks_*.deb
            ```

            **Runtime dependencies (if not already installed):**
            ```bash
            sudo apt install qemu-system-x86 qemu-kvm libwebkit2gtk-4.1-0 libgtk-3-0 librsvg2-2 patchelf
            sudo usermod -aG kvm $USER
            sudo usermod -aG libvirt $USER
            ```
          releaseDraft: false
          prerelease: false
          publish: true
