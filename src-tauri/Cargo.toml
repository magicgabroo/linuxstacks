[package]
name = "linuxstacks"
version = "1.0.0"
edition = "2021"
description = "LinuxStacks - Native Android emulator for Linux using KVM/QEMU"
authors = ["LinuxStacks Contributors"]
license = "MIT"
repository = "https://github.com/magicgabroo/linuxstacks"
keywords = ["android", "emulator", "kvm", "qemu", "linux", "tauri"]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = ["custom-protocol"]

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
config = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
sha2 = { workspace = true }
